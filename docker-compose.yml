services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local-only}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - atlas-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://atlas:${POSTGRES_PASSWORD:-atlas-local-only}@db:5432/atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local-only}
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-before-deployment}
      DATA_ENCRYPTION_SECRET: ${DATA_ENCRYPTION_SECRET:-local-demo-encryption-only-change}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@atlas.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AtlasAdmin2026!}
    ports:
      - "127.0.0.1:3333:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    profiles: ["analysis"]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - atlas-sonarqube-data:/opt/sonarqube/data
      - atlas-sonarqube-extensions:/opt/sonarqube/extensions
      - atlas-sonarqube-logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    restart: unless-stopped

volumes:
  atlas-data:
  atlas-sonarqube-data:
  atlas-sonarqube-extensions:
  atlas-sonarqube-logs:
